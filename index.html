<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbf7f3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Aqua Mitra</title>
<style>
:root{--bg:#fbf7f3;--card:#fff;--ink:#16263a;--mute:#6b7785;--line:#ece5de;--field:#f6f1ec;--accent:#db4109;--on:#fff;--navy:#16263a;--tint:#fff0e8;--good:#15803d;--bad:#c62828;--goodbg:#dcfce7;--shadow:0 2px 8px rgba(22,38,58,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1c2028;--ink:#f3efeb;--mute:#a2a9b3;--line:#2b313b;--field:#151920;--accent:#ff7a45;--on:#1a0d06;--navy:#0b1f36;--tint:#3a2217;--good:#4ade80;--bad:#f87171;--goodbg:#12361f;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1c2028;--ink:#f3efeb;--mute:#a2a9b3;--line:#2b313b;--field:#151920;--accent:#ff7a45;--on:#1a0d06;--navy:#0b1f36;--tint:#3a2217;--good:#4ade80;--bad:#f87171;--goodbg:#12361f;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px 56px}
.hdr-wrap{position:relative;z-index:4}.hdr{display:flex;align-items:center;gap:10px;margin:4px 0 16px;padding:12px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.hdr img{width:56px;height:56px;border-radius:14px;flex:none;background:#fff;object-fit:contain;border:1px solid var(--line)}
.hdr div{flex:1;min-width:0}
.hdr small{display:block;font-size:14px;color:var(--mute)}
h1{font-size:24px;margin:0;line-height:1.15;font-weight:800;letter-spacing:-.3px}
h2{font-size:20px;margin:0 0 8px}
.mute{color:var(--mute);font-size:15px;margin:8px 0 0}
.card{background:var(--card);border-radius:20px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.row>select{flex:1}
.row input{flex:1;min-width:0}
label{display:block;font-size:16px;color:var(--mute);margin:12px 0 0}
input,select{width:100%;font:inherit;font-size:21px;min-height:58px;padding:8px 14px;margin-top:6px;border:2px solid transparent;border-radius:14px;background:var(--field);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{font:inherit;font-weight:700;font-size:20px;min-height:60px;width:100%;margin-top:16px;border:0;border-radius:16px;background:var(--accent);color:var(--on);cursor:pointer}
.btn:active{opacity:.85}
.btn.sec{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);margin-top:10px}
.btn.danger{background:#c62828;color:#fff;box-shadow:none}
.row .btn{width:auto;margin:6px 0 0;padding:0 18px;min-height:58px}
.lang{font:inherit;font-weight:700;font-size:17px;min-height:44px;padding:0 12px;border:0;border-radius:99px;background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);cursor:pointer;white-space:nowrap;flex:none}.profile-btn{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:var(--tint);color:var(--accent);font:inherit;font-size:19px;font-weight:800;cursor:pointer}.profile-menu{position:absolute;right:0;top:calc(100% - 8px);width:min(100%,390px);max-height:calc(100vh - 130px);overflow:auto;z-index:10;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.18)}.profile-ident{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}.profile-ident .av{width:46px;height:46px}.profile-ident .ptext{min-width:0;overflow-wrap:anywhere}.profile-ident .ptext b{display:block}.profile-menu .btn{font-size:18px;min-height:52px}.profile-menu .mute{overflow-wrap:anywhere}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0;padding:5px;background:var(--line);border-radius:18px}
.tabs button{font:inherit;font-size:17px;font-weight:700;min-height:54px;border:0;border-radius:14px;background:transparent;color:var(--ink);cursor:pointer;padding:4px}
.tabs button.on{background:var(--accent);color:var(--on)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.x{font:inherit;font-size:28px;width:52px;height:52px;border:0;background:transparent;color:var(--bad);cursor:pointer;flex:none}
.yn{display:flex;gap:8px;flex:none}
.mini{font:inherit;font-weight:700;font-size:18px;min-height:52px;padding:0 18px;border-radius:14px;border:0;box-shadow:inset 0 0 0 2px var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.mini.yes{background:#c62828;box-shadow:none;color:#fff}
.greeting{margin:14px 0 18px;padding:18px 16px;border-radius:18px;background:var(--tint);color:var(--ink);font-size:22px;font-weight:800}
.developer-credit{text-align:center;color:var(--mute);font-size:12px;line-height:1.4;margin:28px 0 0;padding:8px 0 2px;font-weight:400}.hero{text-align:center;border-radius:20px;padding:22px 16px;margin:14px 0;background:var(--navy);color:#fff;font-size:17px}
.hero b{display:block;font-size:40px;line-height:1.2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat span{display:block;font-size:15px;color:var(--mute)}
.stat b{font-size:26px}
.stat.navy{background:var(--navy);color:#fff}
.stat.orange{background:var(--accent);color:var(--on)}
.stat.navy span,.stat.orange span{color:inherit;opacity:.85}
.bar{height:10px;border-radius:5px;background:var(--line);margin:5px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.split{display:flex;justify-content:space-between;gap:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{text-align:right;padding:10px 6px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:14px;color:var(--mute);border-top:0}
.pond{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:0;border-radius:20px;padding:14px;margin:12px 0;cursor:pointer;min-height:84px;box-shadow:var(--shadow)}
.av{flex:none;width:54px;height:54px;border-radius:50%;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px}
.pond.done .av{background:var(--line);color:var(--mute)}
.pb{flex:1;min-width:0}
.pond b{font-size:21px}
.pond .split{align-items:center;margin-bottom:4px}
.badge{font-size:14px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--line);color:var(--mute)}
.badge.live{background:var(--goodbg);color:var(--good)}
.pfx{display:flex;align-items:center;padding:0 16px;min-height:58px;margin-top:6px;border-radius:14px;background:var(--line);font-weight:700;font-size:20px}
.chk{display:flex;align-items:center;color:var(--mute);font-size:16px}
input[type=checkbox]{width:26px;min-height:26px;height:26px;margin:0 10px 0 0;padding:0}
details summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}details[open] summary{margin-bottom:12px}h3{font-size:17px;margin:16px 0 4px}.ok{color:var(--good);font-weight:600;font-size:16px;margin:12px 0 0}
.err{color:var(--bad);font-weight:600;font-size:16px;margin:12px 0 0}
#msg{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:17px;display:none;z-index:5;max-width:92%}
</style>
</head>
<body>
<div id="msg"></div>
<div id="app"></div>

function save() {
  try { localStorage.setItem('aquaLang', S.lang); } catch (e) {}
  if (!fb || !me) return;
  const ids = new Set(S.cycles.map(c => c.id));
  S.cycles.forEach(c => {
    const d = pondDoc(c), j = JSON.stringify(d);
    if (last[c.id] !== j) { last[c.id] = j; fb.setDoc(fb.doc(db, 'users', me, 'ponds', c.id), d).catch(() => flash(t('eSync'))); }
  });
  Object.keys(last).forEach(id => { if (!ids.has(id)) { delete last[id]; fb.deleteDoc(fb.doc(db, 'users', me, 'ponds', id)).catch(() => flash(t('eSync'))); } });
}
const te = () => S.lang === 'te';

const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const num = n => (+n).toLocaleString('en-IN', { maximumFractionDigits: 1 });
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const dt = d => new Date(d + 'T00:00').toLocaleDateString(loc(), { day: 'numeric', month: 'short' });
const tm = x => new Date('1970-01-01T' + x + ':00').toLocaleTimeString(loc(), { hour: 'numeric', minute: '2-digit' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const newest = a => [...a].sort((x, y) => (y.date + (y.time || '')).localeCompare(x.date + (x.time || '')));

function flash(m) { const e = $('#msg'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2500); }

function stats(id) {
  const f = S.feed.filter(x => x.cid === id), e = S.exp.filter(x => x.cid === id);
  const feedKg = sum(f, x => x.kg), feedCost = sum(f, x => x.kg * x.price);
  const byCat = { Feed: feedCost };
  CATS.forEach(c => byCat[c] = 0);
  e.forEach(x => byCat[x.cat] = (byCat[x.cat] || 0) + x.amt);
  return { feedKg, feedCost, byCat, cost: sum(Object.values(byCat), x => x) };
}

async function saveProfile() {
  const name = val('profile-name').trim();
  profileErr = ''; profileOk = '';
  if (!name) { profileErr = 'eFarmerName'; render(); return; }
  try {
    await fb.updateProfile(auth.currentUser, { displayName: name });
    meLabel = name; profileOk = 'profileSaved'; profileEditing = false;
    render();
  } catch (e) {
    profileErr = (e.code || '').includes('network') ? 'eNet' : 'eGeneric';
    render();
  }
}

async function resetCurrentPassword() {
  profileErr = ''; profileOk = '';
  const email = auth.currentUser?.email;
  if (!email) { profileErr = 'eEmail'; render(); return; }
  try {
    await fb.sendPasswordResetEmail(auth, email);
    profileOk = 'reqSent'; render();
  } catch (e) {
    const c = e.code || '';
    profileErr = c === 'auth/network-request-failed' ? 'eNet' : c === 'auth/too-many-requests' ? 'eMany' : 'eReq';
    render();
  }
}

  return `<div class="card"><h2>${t('addCost')}</h2><p class="mute">${t('costNote')}</p><div class="g2"><label>${t('type')}<select id="e-cat">${CATS.map(c => `<option value="${c}">${cat(c)}</option>`).join('')}</select></label><label>${t('date')}<input id="e-date" type="date" value="${today()}"></label></div><label>${t('amount')}<input id="e-amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label><label>${t('note')}<input id="e-note" placeholder="${t('noteEx')}"></label><button class="btn" data-act="adde">${t('saveCost')}</button></div>
  <div class="card"><div class="split"><h2>${t('costs')}</h2><b>${inr(sum(e, x => x.amt))}</b></div>${list('exp', e, x => li('exp', x, inr(x.amt), cat(x.cat) + (x.note ? ' · ' + esc(x.note) : '')))}</div>`;
}

function sumView() {
  const c = cur(), s = stats(S.cur);
  const days = c.start ? Math.max(0, Math.round((new Date(today() + 'T00:00') - new Date(c.start + 'T00:00')) / 864e5)) : 0;
  const box = (msg, act, danger) => `<div class="card"><b>${msg}</b><div class="g2"><button class="btn ${danger ? 'danger' : ''}" data-act="${act}">${t('yes')}</button><button class="btn sec" data-act="no">${t('no')}</button></div></div>`;
  const bottom = ask === 'done' ? box(t(c.done ? 'askReopen' : 'askDone'), 'done') : ask === 'delc' ? box(t('askDelPond'), 'delc', true) : `<button class="btn sec" data-act="askdone">${t(c.done ? 'reopen' : 'markDone')}</button><button class="btn sec" data-act="askdelc">${t('delPond')}</button>`;
  const cats = Object.entries(s.byCat).map(([k, v]) => `<div class="split"><span>${cat(k)}</span><b>${inr(v)}</b></div><div class="bar"><i style="width:${s.cost ? v / s.cost * 100 : 0}%"></i></div>`).join('');
  const cmp = S.cycles.length > 1 ? `<div class="card"><h2>${t('allPonds')}</h2><div class="scroll"><table><tr><th>${t('pond')}</th><th>${t('feedKgCol')}</th><th>${t('investment')}</th></tr>${S.cycles.map(p => { const q = stats(p.id); return `<tr><td>${esc(pn(p.name))}</td><td>${num(q.feedKg)}</td><td>${inr(q.cost)}</td></tr>`; }).join('')}</table></div></div>` : '';
  return `<div class="hero">${t('totalInv')}<b>${inr(s.cost)}</b></div>
  <div class="stats"><div class="stat"><span>${t('feedUsed')}</span><b>${num(s.feedKg)} kg</b></div><div class="stat"><span>${t('feedCost')}</span><b>${inr(s.feedCost)}</b></div><div class="stat"><span>${t('otherCosts')}</span><b>${inr(s.cost - s.feedCost)}</b></div><div class="stat"><span>${t('days')}</span><b>${days}</b></div></div>
  <div class="card"><h2>${t('where')}</h2>${cats}</div>${cmp}
  ${bottom}
  <p class="mute">${t('dataNote')}</p>`;
}

const confirmBox = (msg, act, danger) => `<div class="card"><b>${msg}</b><div class="g2"><button class="btn ${danger ? 'danger' : ''}" data-act="${act}">${t('yes')}</button><button class="btn sec" data-act="no">${t('no')}</button></div></div>`;

const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

function authView() {
  if (authMode === 'forgot') return forgotView();
  const up = authMode === 'up';
  return topbar() + `<div class="card"><h2>${t(up ? 'createAcc' : 'loginTitle')}</h2><p class="mute">${t(up ? 'createInfo' : 'loginInfo')}</p>${up ? `<label>${t('farmerName')}<input id="a-name" type="text" autocomplete="name" maxlength="80" placeholder="${t('namePlaceholder')}" value="${esc(authName)}"></label>` : ''}<label>${t('email')}<input id="a-em" type="email" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="name@gmail.com" value="${esc(authEm)}"></label><label>${t('password')}<input id="a-pw" type="password" autocomplete="${up ? 'new-password' : 'current-password'}"></label>${up ? `<label>${t('password2')}<input id="a-pw2" type="password" autocomplete="new-password"></label>` : ''}<label class="chk"><input type="checkbox" id="a-show">${t('showPw')}</label>${authErr ? `<p class="err">${t(authErr)}</p>` : ''}<button class="btn" data-act="${up ? 'signup' : 'login'}">${t(up ? 'createBtn' : 'loginBtn')}</button><button class="btn sec" data-act="${up ? 'toin' : 'toup'}">${t(up ? 'haveAcc' : 'newHere')}</button>${up ? '' : `<button class="btn sec" data-act="toforgot">${t('forgot')}</button>`}</div>`;
}

function forgotView() {
  return topbar() + `<div class="card"><h2>${t('forgot')}</h2><p class="mute">${t('forgotInfo')}</p><label>${t('email')}<input id="a-em" type="email" inputmode="email" autocapitalize="none" autocomplete="username" placeholder="name@gmail.com" value="${esc(authEm)}"></label>${authErr ? `<p class="err">${t(authErr)}</p>` : ''}${authOk ? `<p class="ok">${t(authOk)}</p>` : ''}<button class="btn" data-act="sendreq">${t('sendReq')}</button><button class="btn sec" data-act="toin">${t('backLogin')}</button></div>`;
}

// Firebase emails a reset link; the farmer sets a new password himself. No admin needed.
async function sendReset() {
  const em = val('a-em').trim().toLowerCase();
  authEm = em; authOk = '';
  if (!emailOk(em)) { authErr = 'eEmail'; return render(); }
  authErr = '';
  try { await fb.sendPasswordResetEmail(auth, em); authOk = 'reqSent'; }
  catch (e) {
    const c = e.code || '';
    if (c === 'auth/user-not-found') authOk = 'reqSent'; // do not reveal whether an account exists
    else authErr = c === 'auth/network-request-failed' ? 'eNet' : c === 'auth/too-many-requests' ? 'eMany' : c === 'auth/invalid-email' ? 'eEmail' : 'eReq';
  }
  render();
}

async function doAuth(kind) {
  const em = val('a-em').trim().toLowerCase(), pw = val('a-pw');
  const farmerName = kind === 'signup' ? val('a-name').trim() : '';
  authEm = em;
  if (kind === 'signup') authName = farmerName;
  if (kind === 'signup' && !farmerName) { authErr = 'eFarmerName'; return render(); }
  if (!emailOk(em)) { authErr = 'eEmail'; return render(); }
  if (pw.length < 6) { authErr = 'ePin'; return render(); }
  if (kind === 'signup' && pw !== val('a-pw2')) { authErr = 'ePinMatch'; return render(); }
  authErr = '';
  try {
    if (kind === 'signup') {
      const credential = await fb.createUserWithEmailAndPassword(auth, em, pw);
      try { await fb.updateProfile(credential.user, { displayName: farmerName }); } catch (_) {}
      meLabel = farmerName;
      authName = farmerName;
    } else await fb.signInWithEmailAndPassword(auth, em, pw);
  } catch (e) {
    const c = e.code || '';
    authErr = c === 'auth/email-already-in-use' ? 'eExists' : c === 'auth/network-request-failed' ? 'eNet' : c === 'auth/too-many-requests' ? 'eMany' : c === 'auth/invalid-email' ? 'eEmail' : c === 'auth/weak-password' ? 'ePin' : kind === 'signup' ? 'eGeneric' : 'eWrong';
    render();
  }
}

function startSession(u) {
  me = u.uid; meLabel = u.displayName || u.email || ''; loaded = false; authState = 'in'; tab = 'home'; ask = null; profileOpen = false; profileEditing = false; profileErr = ''; profileOk = '';
  unsub = fb.onSnapshot(fb.collection(db, 'users', me, 'ponds'), applySnap, () => { loaded = true; flash(t('eSync')); render(); });
  if (unsubHistory) unsubHistory();
  unsubHistory = fb.onSnapshot(fb.collection(db, 'users', me, 'history'), snap => { pondHistory = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (tab === 'history') render(); }, () => flash(t('eSync')));
}
function endSession() {
  if (unsub) unsub();
  if (unsubHistory) unsubHistory();
  unsub = null; unsubHistory = null; pondHistory = []; me = null; meLabel = ''; loaded = false; authState = 'out'; authMode = 'in'; tab = 'home'; ask = null; profileOpen = false; profileEditing = false; profileErr = ''; profileOk = '';
  S.cycles = []; S.feed = []; S.exp = []; S.cur = null;
  Object.keys(last).forEach(k => delete last[k]);
}
function archivePond(c, status) {
  if (!fb || !me || !c) return;
  const record = {
    name: c.name, start: c.start || '', feedPrice: c.feedPrice || 0,
    done: !!c.done, created: c.created || 0, status,
    archivedAt: Date.now(),
    feed: S.feed.filter(x => x.cid === c.id).map(cf),
    exp: S.exp.filter(x => x.cid === c.id).map(ce)
  };
  fb.setDoc(fb.doc(db, 'users', me, 'history', c.id), record).catch(() => flash(t('eSync')));
}

function applySnap(snap) {
  const cy = [], fd = [], ex = [];
  snap.docs.forEach(d => {
    const p = d.data();
    cy.push({ id: d.id, name: p.name, start: p.start, feedPrice: p.feedPrice, done: !!p.done, created: p.created || 0 });
    (p.feed || []).forEach(x => fd.push({ ...cf(x), cid: d.id }));
    (p.exp || []).forEach(x => ex.push({ ...ce(x), cid: d.id }));
  });
  cy.sort((a, b) => a.created - b.created);
  S.cycles = cy; S.feed = fd; S.exp = ex;
  if (!cur()) S.cur = cy[0] ? cy[0].id : null;
  Object.keys(last).forEach(k => delete last[k]);
  cy.forEach(c => last[c.id] = JSON.stringify(pondDoc(c)));
  const first = !loaded; loaded = true;
  const a = document.activeElement, typing = a && /INPUT|SELECT/.test(a.tagName);
  if (first || (!typing && !snap.metadata.hasPendingWrites)) render();
}

// Data saved by the older, no-login version of the app on this phone
function legacy() {
  try { const r = JSON.parse(localStorage.getItem(K)); return r && r.cycles && r.cycles.length ? r : null; } catch (e) { return null; }
}
function importLegacy() {
  const lg = legacy(); if (!lg) return;
  lg.cycles.forEach((c, i) => S.cycles.push({ id: c.id, name: c.name, start: c.start || '', feedPrice: c.feedPrice || 0, done: !!c.done, created: c.created || Date.now() + i }));
  (lg.feed || []).forEach(x => S.feed.push({ ...cf(x), cid: x.cid }));
  (lg.exp || []).forEach(x => S.exp.push({ ...ce(x), cid: x.cid }));
  S.cur = S.cycles[0].id; tab = 'home'; save();
  try { localStorage.removeItem(K); } catch (e) {}
}

function render() {
  document.documentElement.lang = te() ? 'te' : 'en';
  if (authState === 'loading' || (authState === 'in' && !loaded)) { $('#app').innerHTML = topbar() + `<div class="card"><p>${t('loading')}</p></div>`; return; }
  if (authState === 'nofb') { $('#app').innerHTML = topbar() + `<div class="card"><p>${t(cfgMissing ? 'needConfig' : 'needNet')}</p></div>`; return; }
  if (authState === 'out') { $('#app').innerHTML = authView(); return; }
  if (tab === 'history') { $('#app').innerHTML = historyView(); return; }
  if (!S.cycles.length || tab === 'new') { $('#app').innerHTML = newView(); return; }
  if (!cur()) S.cur = S.cycles[0].id;
  if (tab === 'home') { $('#app').innerHTML = homeView(); return; }
  $('#app').innerHTML = head() + tabs() + ({ feed: feedView, exp: expView, sum: sumView }[tab] || feedView)();
}

const val = id => document.getElementById(id).value;
const pos = id => { const n = parseFloat(val(id)); return isNaN(n) || n < 0 ? null : n; };

document.addEventListener('change', e => { if (e.target.id === 'cyc') { S.cur = e.target.value; ask = null; save(); render(); } });

document.addEventListener('change', e => { if (e.target.id === 'a-show') document.querySelectorAll('#a-pw,#a-pw2').forEach(i => { i.type = e.target.checked ? 'text' : 'password'; }); });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  ask = null;
  if (a === 'profile') { profileOpen = !profileOpen; profileEditing = false; profileErr = ''; profileOk = ''; }
  else if (a === 'history') { tab = 'history'; profileOpen = false; ask = null; }
  else if (a === 'editprofile') { profileEditing = true; profileErr = ''; profileOk = ''; }
  else if (a === 'profilecancel') { profileEditing = false; profileErr = ''; profileOk = ''; }
  else if (a === 'saveprofile') { saveProfile(); return; }
  else if (a === 'profilereset') { resetCurrentPassword(); return; }
  else if (a === 'tab') tab = b.dataset.t;
  else if (a === 'lang') { S.lang = te() ? 'en' : 'te'; save(); }
  else if (a === 'login' || a === 'signup') { doAuth(a); return; }
  else if (a === 'toup' || a === 'toin') { authMode = a === 'toup' ? 'up' : 'in'; authErr = ''; authOk = ''; }
  else if (a === 'toforgot') { authMode = 'forgot'; authErr = ''; authOk = ''; }
  else if (a === 'sendreq') { sendReset(); return; }
  else if (a === 'askout') { ask = 'out'; profileOpen = true; profileEditing = false; }
  else if (a === 'out') { profileOpen = false; fb.signOut(auth); return; }
  else if (a === 'import') importLegacy();
  else if (a === 'askdel') ask = 'del:' + b.dataset.id;
  else if (a === 'askdone' || a === 'askdelc') ask = a.slice(3);
  else if (a === 'no') { if (ask === 'out') ask = null; /* closes the confirmation */ }
  else if (a === 'newc') tab = 'new';
  else if (a === 'cancel' || a === 'home') tab = 'home';
  else if (a === 'open') { S.cur = b.dataset.id; tab = 'feed'; }
  else if (a === 'done') { const c = cur(); c.done = !c.done; save(); }
  else if (a === 'setfp') { const p = pos('fp'); if (!p) return flash(t('eFp')); cur().feedPrice = p; save(); flash(t('okFp')); }
  else if (a === 'addc') {
    const n = val('c-name').trim().replace(/^(pond|చెరువు)\s*/i, ''); if (!n) return flash(t('eName'));
    const normalized = n.replace(/\s+/g, ' ').toLocaleLowerCase();
    if (S.cycles.some(p => !p.done && String(p.name).replace(/^(pond|చెరువు)\s*/i, '').replace(/\s+/g, ' ').toLocaleLowerCase() === normalized)) return flash(t('eDuplicate'));
    const fp = pos('c-fp'); if (!fp) return flash(t('eFp'));
    const c = { id: uid(), name: 'Pond ' + n, start: val('c-date'), feedPrice: fp, created: Date.now() }; S.cycles.push(c); S.cur = c.id; tab = 'feed'; save();
  } else if (a === 'addf') {
    const kg = pos('f-kg'), c = cur();
    if (!kg) return flash(t('eKg')); if (!c.feedPrice) return flash(t('eFpFirst'));
    S.feed.push({ id: uid(), cid: S.cur, date: val('f-date') || today(), time: val('f-time') || nowT(), kg, price: c.feedPrice / 1000 }); save(); flash(t('okFeed'));
  } else if (a === 'adde') {
    const amt = pos('e-amt'); if (!amt) return flash(t('eAmt'));
    S.exp.push({ id: uid(), cid: S.cur, date: val('e-date') || today(), cat: val('e-cat'), amt, note: val('e-note').trim() }); save(); flash(t('okCost'));
  } else if (a === 'del') {
    S[b.dataset.k] = S[b.dataset.k].filter(x => x.id !== b.dataset.id); save();
  } else if (a === 'delc') {
    const id = S.cur, c = cur();
    archivePond(c, 'deleted');
    S.cycles = S.cycles.filter(p => p.id !== id);
    ['feed', 'exp'].forEach(k => S[k] = S[k].filter(x => x.cid !== id));
    S.cur = S.cycles.length ? S.cycles[0].id : null; tab = 'home'; save();
  }
  render();
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
render();
(async () => {
  if (cfgMissing) { authState = 'nofb'; return render(); }
  try {
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [a, b, c] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
    fb = { ...a, ...b, ...c };
    const app = fb.initializeApp(firebaseConfig);
    auth = fb.getAuth(app);
    db = fb.initializeFirestore(app, { localCache: fb.persistentLocalCache({ tabManager: fb.persistentMultipleTabManager() }) });
  } catch (e) { fb = null; }
  if (!fb) { authState = 'nofb'; return render(); }
  fb.onAuthStateChanged(auth, u => { if (u) startSession(u); else endSession(); render(); });
})();
</script>
</body>
</html>
